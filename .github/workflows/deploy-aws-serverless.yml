name: Deploy AWS Serverless

on:
  push:
    branches:
      - aws-serverless

env:
  AWS_REGION: us-east-1
  # Actual account ID -- fine to keep in plain text, it's not a secret.
  AWS_ACCOUNT_ID: "395249043027"

permissions:
  id-token: write # required for OIDC -- do not remove
  contents: read


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [click-fraud, churn-prediction]
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      # --- This step fails until AWS_DEPLOY_ROLE_ARN is set as a repo
      # secret, pointing at an IAM role that trusts GitHub's OIDC
      # provider. That role does not exist yet -- see the README note
      # below for what to create before this workflow can run at all. ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set service path
        id: service-vars
        run: |
          if [ "${{ matrix.service }}" = "click-fraud" ]; then
            echo "dir=click_fraud" >> "$GITHUB_OUTPUT"
            echo "repo=click-fraud-serving" >> "$GITHUB_OUTPUT"
            echo "function=click-fraud-scoring" >> "$GITHUB_OUTPUT"
          else
            echo "dir=churn_prediction" >> "$GITHUB_OUTPUT"
            echo "repo=churn-prediction-serving" >> "$GITHUB_OUTPUT"
            echo "function=churn-prediction-scoring" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- provenance/sbom disabled deliberately: default Buildx output
      # is a multi-manifest OCI image index that Lambda's CreateFunction/
      # UpdateFunctionCode rejects outright. This bit us once already
      # (see PIPELINE_README / chat history) -- don't remove these flags. ---
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f infra/aws-serverless/${{ matrix.service }}/Dockerfile.lambda \
            -t "$ECR_REGISTRY/${{ steps.service-vars.outputs.repo }}:${{ github.sha }}" \
            -t "$ECR_REGISTRY/${{ steps.service-vars.outputs.repo }}:latest" \
            --push \
            .

      - name: Update Lambda function code
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.service-vars.outputs.function }}" \
            --image-uri "$ECR_REGISTRY/${{ steps.service-vars.outputs.repo }}:${{ github.sha }}"